name: Collect 3419 holdings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - monitor.py
      - analysis.py
      - hkex_calendar.py
      - test_monitor.py
      - .github/workflows/collect.yml
  schedule:
    - cron: '17 1,10,13 * * *'
permissions:
  contents: write
concurrency:
  group: holdings-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 requests
      - run: python -m unittest -q
      - name: Validate and archive issuer data
        run: python monitor.py
      - name: Build daily analysis
        id: analysis
        if: ${{ !cancelled() }}
        run: python analysis.py
      - name: Save observations and flagged revisions
        if: ${{ !cancelled() }}
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/coverage.csv data/holdings data/details
          for folder in data/page data/revisions; do
            if [ -d "$folder" ]; then git add -- "$folder"; fi
          done
          if [ "$ANALYSIS_OUTCOME" = 'success' ]; then git add -- data/analysis.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record daily holdings'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: Keep the source HTML for failed runs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: holdings-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: _diagnostics/
          if-no-files-found: ignore
          retention-days: 14
